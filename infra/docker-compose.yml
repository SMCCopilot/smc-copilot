# Production-shaped Compose project for the Oracle free VM (B02 section 1). Secrets come from an env file that is
# decrypted at deploy time (SOPS + age) and never committed. The container environment comes from env_file
# below (path relative to infra/); the tunnel profile also needs CLOUDFLARE_TUNNEL_TOKEN in the shell or --env-file.
#   docker compose up -d                      # api only
#   docker compose --profile tunnel up -d     # api + cloudflared
# UNVERIFIED until run on a host with a Docker daemon.
name: smc-copilot

services:
  api:
    image: ${SMC_API_IMAGE:-smc-copilot-api:latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ${SMC_ENV_FILE:-../.env.prod}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HEADERS: "true" # the API is only reachable through the tunnel
    # Reached only through cloudflared on the internal network, plus loopback for local checks.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A08 section 1.1: API + worker 1.0 to 1.8 GB.
    mem_limit: 1800m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Outbound-only tunnel to Cloudflare: no inbound port is opened on the VM (A08 section 1.1).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
