# Railway service configuration (config as code). Deploys the API from the repository Dockerfile.
# UNVERIFIED until the first deploy: re-check key names against Railway's current "config as code" docs.
# Region: choose a NON-US region in the Railway dashboard (Binance blocks US IP addresses), ideally close to
# your Supabase region.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
